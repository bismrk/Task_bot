[project]
name = "tasks-bot"
version = "0.1.0"
description = "Telegram Task Tracker Bot & Mini App"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "greenlet",
    "aiosqlite",
    "pydantic>=2.0",
    "pydantic-settings",
    "apscheduler",
    "google-genai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

