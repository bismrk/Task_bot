services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasks-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/tasks.db}
      - WEBAPP_URL=${WEBAPP_URL:-}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-False}
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
